# Mises à jour des dépendances (hebdomadaires, groupées pour limiter le nombre de PR).
# npm : le lockfile racine couvre les workspaces app, app_dashboard, server et
# server_discord. companion/ (hors workspaces, en pause) n'est volontairement pas suivi.
# Les PR Dependabot passent le check « Conventions » en avertissement (pr-check.mjs).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
