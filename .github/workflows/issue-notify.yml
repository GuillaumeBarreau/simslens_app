name: Notifications Discord — tickets

# Publie sur le salon Discord des agents la création, l'assignation, les changements
# de statut, la fermeture et la réouverture des issues (scripts/agents/issue-event.mjs).
# Ne fait que notifier : aucun agent ne s'exécute dans GitHub Actions.

on:
  issues:
    types: [opened, assigned, unassigned, labeled, closed, reopened]

# Pas de groupe `concurrency` : GitHub n'y garde qu'une exécution en attente et
# annule les autres, ce qui perdait des notifications lors d'une rafale
# d'événements (SIMS-128). Les messages peuvent arriver dans le désordre.

permissions:
  contents: read

jobs:
  notify:
    name: Notifier Discord
    # Jamais dans un fork : le webhook Discord est un secret du dépôt d'origine.
    if: github.repository == 'GuillaumeBarreau/simslens_app'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/agents

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Publier l'événement
        env:
          AGENTS_DISCORD_WEBHOOK_URL: ${{ secrets.AGENTS_DISCORD_WEBHOOK_URL }}
        run: node scripts/agents/issue-event.mjs
