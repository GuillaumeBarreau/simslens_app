name: Build & Push — Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    # Jamais dans un fork : pousse vers GHCR avec les secrets du dépôt d'origine.
    if: github.repository == 'GuillaumeBarreau/sims_tracking'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            context: .
            dockerfile: ./server/Dockerfile
            image: server

          - service: server_discord
            context: .
            dockerfile: ./server_discord/Dockerfile
            image: server-discord

          - service: app
            context: .
            dockerfile: ./app/Dockerfile
            image: app
            # Secret absent : lien d'invitation du bot masqué.
            build-args: |
              VITE_DISCORD_CLIENT_ID=${{ secrets.VITE_DISCORD_CLIENT_ID }}

          - service: app_dashboard
            context: .
            dockerfile: ./app_dashboard/Dockerfile
            image: app-dashboard
            build-args: VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USER }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
          build-args: ${{ matrix.build-args }}
