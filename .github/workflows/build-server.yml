name: Build & Push — Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    # Jamais dans un fork : pousse vers GHCR avec les secrets du dépôt d'origine.
    if: github.repository == 'GuillaumeBarreau/simslens_app'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            context: .
            dockerfile: ./server/Dockerfile
            image: server

          - service: server_discord
            context: .
            dockerfile: ./server_discord/Dockerfile
            image: server-discord

          - service: app
            context: .
            dockerfile: ./app/Dockerfile
            image: app
            # Secret absent : lien d'invitation du bot masqué.
            build-arg-secret: VITE_DISCORD_CLIENT_ID

          - service: app_dashboard
            context: .
            dockerfile: ./app_dashboard/Dockerfile
            image: app-dashboard
            build-arg-secret: VITE_CLERK_PUBLISHABLE_KEY

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USER }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
          # `secrets` est interdit dans `strategy.matrix` (workflow invalide) : la
          # matrice ne porte que le nom du secret, lu ici.
          build-args: ${{ matrix.build-arg-secret && format('{0}={1}', matrix.build-arg-secret, secrets[matrix.build-arg-secret]) || '' }}
