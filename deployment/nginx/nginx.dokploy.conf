upstream client {
    server client:80;
}

upstream server_api {
    server server:5000;
}

upstream dashboard {
    server dashboard:80;
}

# TLS terminé par Traefik (Dokploy) : Nginx n'écoute qu'en HTTP interne.
# Traefik gère déjà HTTP -> HTTPS ; ici seulement www -> domaine canonique.
# Faire confiance à Traefik pour l'IP réelle et le schéma
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name www.simslens.com;
    return 301 https://simslens.com$request_uri;
}

server {
    listen 80 default_server;
    server_name simslens.com;

    # En-têtes de sécurité, sur toutes les réponses. Attention : une `location` qui déclare
    # son propre add_header n'hérite plus de ceux-ci (voir la SPA ci-dessous).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    # Résolveur DNS interne Docker : permet à Nginx de démarrer même si le conteneur
    # optionnel `simslens-landing` (dépôt séparé) n'est pas déployé.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Admin API routes (dashboard)
    location /admin/ {
        proxy_pass http://server_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Dashboard SPA
    location /dashboard/ {
        proxy_pass http://dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API routes (/1/...)
    location /1/ {
        proxy_pass http://server_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Cookie $http_cookie;
    }

    # Auth routes (OAuth Battle.net, Discord)
    location /auth/ {
        proxy_pass http://server_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Cookie $http_cookie;
    }

    # Health check
    location /health {
        proxy_pass http://server_api;
    }

    # --- Landing Page & SEO (conteneur optionnel `simslens-landing`) ---
    # Si `simslens-landing` n'est pas présent (instance auto-hébergée open source),
    # Nginx bascule automatiquement vers `@client_fallback`.
    location = / {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 502 503 504 = @client_fallback;
    }

    location = /mentions-legales {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 502 503 504 = @client_fallback;
    }

    location ^~ /landing-assets/ {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
    }

    # Version anglaise de la landing (/en/, /en/legal-notice). /en → /en/ est géré par la landing.
    location = /en {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
    }

    location ^~ /en/ {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 502 503 504 = @client_fallback;
    }

    # Images publiques de la landing (Open Graph, sitemap, captures)
    location ^~ /images/ {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
    }

    # Anciennes URL des images : la landing répond par une redirection 301 vers /images/
    location ^~ /src/pages/landingPage/ {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
    }

    location ~ ^/(sitemap\.xml|robots\.txt|site\.webmanifest)$ {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
    }

    location @client_fallback {
        proxy_pass http://client;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend (React SPA, derrière connexion). Ses routes étant dynamiques (:guild, :season…),
    # toute URL inconnue renvoie l'application avec un code 200 : on interdit l'indexation pour
    # éviter les « soft 404 ». Les en-têtes de sécurité sont répétés, add_header n'étant pas
    # hérité dès qu'une location en déclare un.
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_pass http://client;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
