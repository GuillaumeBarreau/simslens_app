# Redirect HTTP → HTTPS, directement vers le domaine canonique (sans www)
server {
    listen 80;
    server_name simslens.com www.simslens.com;
    return 301 https://simslens.com$request_uri;
}

# www → domaine canonique (évite un hôte dupliqué pour les moteurs de recherche)
server {
    listen 443 ssl;
    http2 on;
    server_name www.simslens.com;

    ssl_certificate /etc/letsencrypt/live/simslens.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simslens.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://simslens.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name simslens.com;

    ssl_certificate /etc/letsencrypt/live/simslens.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simslens.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # En-têtes de sécurité, sur toutes les réponses. Attention : une `location` qui déclare
    # son propre add_header n'hérite plus de ceux-ci (voir la SPA ci-dessous).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    # Résolveur DNS interne Docker. Les conteneurs sont joints via des variables : Nginx résout
    # leur nom à la requête (cache 10 s) et non une seule fois au démarrage. Un redéploiement
    # recrée client/dashboard/server avec de nouvelles IP sans recréer Nginx ; avec des blocs
    # `upstream`, il garderait les anciennes IP (SIMS-017). Cela permet aussi de démarrer sans
    # le conteneur optionnel `simslens-landing` (dépôt séparé).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $client_upstream http://client:80;
    set $server_upstream http://server:5000;
    set $dashboard_upstream http://dashboard:80;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Admin API routes (dashboard)
    location /admin/ {
        proxy_pass $server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard SPA
    # Avec une variable, proxy_pass ne retire plus le préfixe : le rewrite s'en charge.
    location /dashboard/ {
        rewrite ^/dashboard/(.*)$ /$1 break;
        proxy_pass $dashboard_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API routes (/1/...)
    location /1/ {
        proxy_pass $server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Auth routes (OAuth Battle.net, Discord)
    location /auth/ {
        proxy_pass $server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Health check
    location /health {
        proxy_pass $server_upstream;
    }

    # --- Landing Page & SEO (conteneur optionnel `simslens-landing`) ---
    # Si `simslens-landing` n'est pas présent (instance auto-hébergée open source),
    # Nginx bascule automatiquement vers `@client_fallback`.
    location = / {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 502 503 504 = @client_fallback;
    }

    location = /mentions-legales {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 502 503 504 = @client_fallback;
    }

    location ^~ /landing-assets/ {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
    }

    # Version anglaise de la landing (/en/, /en/legal-notice). /en → /en/ est géré par la landing.
    location = /en {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
    }

    location ^~ /en/ {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 502 503 504 = @client_fallback;
    }

    # Images publiques de la landing (Open Graph, sitemap, captures)
    location ^~ /images/ {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
    }

    # Anciennes URL des images : la landing répond par une redirection 301 vers /images/
    location ^~ /src/pages/landingPage/ {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
    }

    location ~ ^/(sitemap\.xml|robots\.txt|site\.webmanifest)$ {
        set $landing_upstream http://simslens-landing:80;
        proxy_pass $landing_upstream;
        proxy_set_header Host $host;
    }

    location @client_fallback {
        proxy_pass $client_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend (React SPA, derrière connexion). Ses routes étant dynamiques (:guild, :season…),
    # toute URL inconnue renvoie l'application avec un code 200 : on interdit l'indexation pour
    # éviter les « soft 404 ». Les en-têtes de sécurité sont répétés, add_header n'étant pas
    # hérité dès qu'une location en déclare un.
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_pass $client_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
